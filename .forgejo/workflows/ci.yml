# Forgejo Actions workflow — lints the shell scripts on every push/PR.
# When you migrate this repo to your self-hosted Forgejo, register a runner
# (https://forgejo.org/docs/latest/admin/actions/) and this runs automatically.
# It is also GitHub-Actions compatible if you keep a copy under .github/workflows/.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: |
          shopt -s globstar nullglob
          shellcheck -x --severity=warning lib/*.sh scripts/*.sh scripts/**/*.sh

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n syntax check
        run: |
          shopt -s globstar nullglob
          for f in lib/*.sh scripts/*.sh scripts/**/*.sh; do
            echo "checking $f"; bash -n "$f"
          done
