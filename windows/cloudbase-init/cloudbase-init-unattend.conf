# cloudbase-init-unattend.conf — the variant Cloudbase-Init runs DURING the
# sysprep/specialize pass (referenced by Unattend.xml). It runs a reduced plugin
# set to set the hostname and extend the system volume before first interactive
# logon. Copied alongside cloudbase-init.conf by bootstrap.ps1.

[DEFAULT]
username=Admin
groups=Administrators
inject_user_password=true
config_drive_raw_hhd=true
config_drive_cdrom=true
config_drive_vfat=true
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService,cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin
verbose=true
logdir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
logfile=cloudbase-init-unattend.log
allow_reboot=false
stop_service_on_exit=false
