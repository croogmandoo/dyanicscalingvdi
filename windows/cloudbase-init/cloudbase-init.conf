# cloudbase-init.conf — main config used on every boot of a clone.
# Reads metadata from the Proxmox cloud-init drive (ConfigDrive / NoCloud) so
# each autoscaled clone gets a unique hostname and any injected credentials.
# Copied to C:\Program Files\Cloudbase Solutions\Cloudbase-Init\conf\ by bootstrap.ps1.

[DEFAULT]
username=Admin
groups=Administrators
inject_user_password=true
config_drive_raw_hhd=true
config_drive_cdrom=true
config_drive_vfat=true
# Proxmox presents cloud-init as a NoCloud/ConfigDrive CD-ROM.
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService,cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.windows.ntpclient.NTPClientPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.common.userdata.UserDataPlugin
verbose=true
logdir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
logfile=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
allow_reboot=false
stop_service_on_exit=false
